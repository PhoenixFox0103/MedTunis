<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#087f73">
  <title>Compte confirmé — MediLink TN</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,"Segoe UI",Arial,sans-serif;color:#10363c}
    body{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 18% 16%,rgba(45,212,191,.28),transparent 27%),radial-gradient(circle at 86% 80%,rgba(34,211,238,.20),transparent 28%),linear-gradient(135deg,#effcf9 0%,#f7fbfc 55%,#eaf8f8 100%)}
    .shell{width:min(680px,100%);position:relative}.brand{display:flex;align-items:center;justify-content:center;gap:11px;margin-bottom:22px;font-size:25px;font-weight:900;color:#087f73}.heart{display:grid;place-items:center;width:44px;height:44px;border-radius:15px;background:#087f73;color:#fff;box-shadow:0 12px 30px rgba(8,127,115,.25)}
    .card{position:relative;overflow:hidden;padding:54px 48px 44px;text-align:center;border:1px solid rgba(8,127,115,.14);border-radius:32px;background:rgba(255,255,255,.94);box-shadow:0 30px 80px rgba(15,70,76,.14);backdrop-filter:blur(14px)}.card:before{content:"";position:absolute;inset:0 0 auto;height:7px;background:linear-gradient(90deg,#087f73,#16a6a1,#22c7bd)}
    .check{width:88px;height:88px;margin:0 auto 24px;display:grid;place-items:center;border-radius:50%;background:linear-gradient(145deg,#d8faf2,#c8f4eb);color:#087f73;font-size:44px;font-weight:900;box-shadow:0 0 0 12px #f0fcf9}
    .eyebrow{display:inline-flex;padding:7px 11px;border-radius:999px;background:#e6faf5;color:#087f73;font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}h1{margin:15px 0 12px;font-size:clamp(32px,6vw,49px);line-height:1.05;letter-spacing:-.04em}p{max-width:500px;margin:0 auto;color:#61777c;font-size:17px;line-height:1.65}.button{display:inline-flex;align-items:center;justify-content:center;gap:9px;margin-top:28px;padding:15px 22px;border-radius:14px;background:linear-gradient(135deg,#087f73,#0e9e96);color:#fff;text-decoration:none;font-weight:850;box-shadow:0 14px 30px rgba(8,127,115,.24);transition:.18s}.button:hover{transform:translateY(-2px);box-shadow:0 18px 36px rgba(8,127,115,.3)}.details{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin-top:28px;padding-top:24px;border-top:1px solid #e4eeee;color:#788b8f;font-size:13px}.details span{display:flex;align-items:center;gap:6px}.foot{margin-top:16px;text-align:center;color:#7a9094;font-size:12px}
    @media(max-width:600px){.card{padding:44px 22px 34px;border-radius:24px}.details{display:grid;gap:9px}h1{font-size:36px}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="brand"><span class="heart">♥</span><span>MediLink TN</span></div>
    <section class="card">
      <div class="check" aria-hidden="true">✓</div>
      <span class="eyebrow">Confirmation réussie</span>
      <h1>Votre compte est activé</h1>
      <p>Votre adresse e-mail a bien été confirmée. Votre espace patient sécurisé est maintenant prêt.</p>
      <a class="button" href="/">Accéder à mon espace patient <span>→</span></a>
      <div class="details"><span>✓ Dossier personnel</span><span>✓ Accès contrôlé</span><span>✓ Données privées</span></div>
    </section>
    <div class="foot">MediLink TN · Votre santé, accessible en toute sécurité</div>
  </main>
</body>
</html>
